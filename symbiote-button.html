<title>Symbiote Button</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
<style>
  /* Layout: one empty near-white field, a single pool of black liquid dead centre; the liquid, its strands and the label are painted on one canvas, the DOM button underneath only handles focus and clicks. */
  :root {
    --paper: #ECECEA;
    --ink: #0a0a0b;
    --panel: rgba(250, 250, 248, 0.94);
    --panel-line: #c9c9c4;
    --font-label: "Outfit", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "Outfit", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) and (pointer: fine) {
    html, body, button, input, label { cursor: none !important; }
  }

  .stage {
    height: 100%;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }

  .btn-wrap {
    --glow: 0;
    position: relative;
    width: min(340px, 100%);
    height: 90px;
  }
  /* soft contact shadow pooled under the liquid */
  .btn-wrap::after {
    content: "";
    position: absolute;
    left: 8%; right: 8%; bottom: -18px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(10, 10, 11, 0.45), rgba(10, 10, 11, 0) 72%);
    filter: blur(6px);
    opacity: var(--shadow, 1);
    pointer-events: none;
  }
  /* reduced-motion proximity halo */
  .btn-wrap::before {
    content: "";
    position: absolute;
    inset: -34px -40px;
    border-radius: 999px;
    background: radial-gradient(50% 50% at 50% 50%, rgba(10, 10, 11, 0.16), rgba(10, 10, 11, 0) 70%);
    opacity: var(--glow);
    filter: blur(8px);
    pointer-events: none;
  }

  /* hit area + focus target; the visible liquid is drawn on #fx */
  .btn {
    position: relative;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 999px;
    padding: 0;
    background: transparent;
    color: transparent;
    font: 800 27px/1 var(--font-label);
    letter-spacing: -0.04em;
  }
  .btn:focus { outline: none; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 9px; }

  #fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  #cursor {
    position: fixed;
    left: 0; top: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    will-change: transform;
    filter: drop-shadow(3px 5px 2.5px rgba(10, 10, 11, 0.30));
  }
  #cursor.on { opacity: 1; }
  #cursorImg {
    display: block;
    width: 34px;
    height: 40px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transform-origin: 12px 2px;
    transition: transform 0.12s cubic-bezier(.3, 1.6, .5, 1);
  }
  #cursor.grab #cursorImg { transform: scale(1.06, 0.93); }
  #cursor.press #cursorImg { transform: scale(1.12, 0.84); }

  #debug {
    position: fixed;
    z-index: 8;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(300px, calc(100vw - 32px));
    max-height: calc(100% - 32px);
    overflow: auto;
    box-sizing: border-box;
    padding: 12px 14px 14px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    font: 11px/1.3 var(--font-mono);
    color: var(--ink);
    box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.3);
    -webkit-user-select: text;
    user-select: text;
  }
  #debug header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 8px; }
  #debug header b { letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
  #debug .rows { display: grid; grid-template-columns: 92px 1fr 44px; gap: 5px 8px; align-items: center; }
  #debug label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #debug input[type=range] { width: 100%; min-width: 0; accent-color: var(--ink); }
  #debug output { text-align: right; font-variant-numeric: tabular-nums; }
  #debug .foot { display: flex; gap: 12px; align-items: center; padding-top: 10px; }
  #debug button { font: inherit; padding: 3px 8px; border: 1px solid var(--panel-line); border-radius: 6px; background: transparent; color: var(--ink); }
  #debug :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>

<main class="stage">
  <div class="btn-wrap" id="wrap">
    <button class="btn" id="cta" type="button">let's collaborate</button>
  </div>
</main>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="cursor" aria-hidden="true"><img id="cursorImg" alt=""></div>
<aside id="debug" hidden aria-label="Tuning panel">
  <header><b>symbiote · tuning</b><span id="fps">– fps</span></header>
  <div class="rows" id="knobs"></div>
  <div class="foot">
    <label><input type="checkbox" id="dbgOverlay"> overlay</label>
    <button type="button" id="dbgReset">reset</button>
    <span>press D to hide</span>
  </div>
</aside>

<script>
(() => {
  'use strict';

  /* ───────────────────────── tunables ───────────────────────── */
  const DEFAULTS = {
    attachRadius: 180,   // px from the liquid edge where strands lunge
    strandsMin: 30,
    strandsMax: 44,
    ropePoints: 14,      // verlet points per strand (applies to new strands)
    stiffness: 0.86,     // constraint relaxation per iteration
    iterations: 5,
    damping: 0.9,        // velocity kept per 120 Hz step (lower = thicker, more viscous)
    slack: 0.12,         // extra rope length at rest (fraction of span)
    rootArc: 170,        // px of perimeter the bundle root spreads over
    hoverArc: 70,        // tighter spread while hovering the pill itself
    breakMin: 1.4,       // break distance range, × attachRadius
    breakMax: 2.2,
    widthMin: 1.0,
    widthMax: 3.6,
    necking: 1.4,        // how much a strand thins mid-span as it stretches
    wobble: 260,         // curl/noise acceleration, px/s²
    bend: 420,           // per-strand sideways bias, px/s²
    emergeMin: 260,      // ms
    emergeMax: 420,
    stagger: 5,          // ms between strand launches
    retractMs: 460,
    cooldownMs: 500,
    spikesMin: 4,
    spikesMax: 8,
    mound: 16,           // px the surface swells toward the cursor
    surfSpring: 0.005,   // surface pull toward its target shape, per step
    surfVisc: 0.9,       // surface velocity kept per step
    surfSpread: 0.08,    // how fast a bulge flows sideways along the edge
    idleMin: 1400,       // ms between idle twitches
    idleMax: 3800,
    ballMs: 440,         // click → pill rounds into a ball, then bursts
    holdMs: 1900,        // ms after the click before the droplets flow home
    burstDrops: 160,
    burstSpeed: 1700,    // px/s
    gravity: 320,        // px/s² on the spilled droplets
    drag: 0.982,         // droplet velocity kept per step; thick liquid stops fast and sticks
  };
  const COLORS = {
    strand: '#09090a',
    bodyTop: '#101013',
    bodyMid: '#050506',
    bodyLow: '#0c0c0f',
    glint: 'rgba(255,255,255,0.30)',
    specular: 'rgba(255,255,255,0.55)',
    rim: 'rgba(255,255,255,0.42)',
    caustic: 'rgba(255,255,255,0.16)',
    label: '#ffffff',
    handFill: '#ffffff',
    handLine: '#0a0a0b',
    overlay: 'rgba(10,10,11,0.35)',
  };
  const CFG = { ...DEFAULTS };
  const H = 1 / 120;          // physics step
  const S = 2;                // cursor pixel scale
  const M = 200;              // samples around the liquid surface

  /* ───────────────────────── helpers ───────────────────────── */
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const mod = (a, n) => ((a % n) + n) % n;
  const easeOutBack = t => { const c1 = 0.9, c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; };

  const btn = document.getElementById('cta');
  const wrap = document.getElementById('wrap');
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  const cursorEl = document.getElementById('cursor');
  const cursorImg = document.getElementById('cursorImg');
  const dbg = document.getElementById('debug');

  const mqReduce = matchMedia('(prefers-reduced-motion: reduce)');
  let reduced = mqReduce.matches;
  mqReduce.addEventListener?.('change', e => {
    reduced = e.matches;
    if (reduced) { strands.length = 0; spikes.length = 0; disp.fill(0); dvel.fill(0); }
    else wrap.style.setProperty('--glow', 0);
  });

  /* ───────────────────────── pixel hand ───────────────────────── */
  const HAND = [
    '.....BB..........',
    '....BWWB.........',
    '....BWWB.........',
    '....BWWB.........',
    '....BWWB.........',
    '....BWWBBB.......',
    '....BWWBWWBBB....',
    '....BWWBWWBWWBB..',
    '.BB.BWWBWWBWWBWB.',
    'BWWBBWWWWWWWWBWWB',
    'BWWWBWWWWWWWWWWWB',
    '.BWWBWWWWWWWWWWWB',
    '..BWWWWWWWWWWWWWB',
    '..BWWWWWWWWWWWWWB',
    '...BWWWWWWWWWWWB.',
    '...BWWWWWWWWWWWB.',
    '....BWWWWWWWWWB..',
    '....BWWWWWWWWWB..',
    '.....BWWWWWWWB...',
    '.....BBBBBBBBB...',
  ];
  // grabbed: index finger curls down to a stub
  const GRAB = HAND.map((r, i) => i < 3 ? '.'.repeat(17) : i === 3 ? '.....BB..........' : r);
  const HOT = { x: 6, y: 0 };
  // tip anchors in sprite pixel coords: [x, y, isFingertip]
  const ANCHORS = [
    [6, 0.6, 1], [6, 0.6, 1], [4.4, 4, 0], [7.6, 4, 0],
    [9, 6.2, 0], [12, 7.2, 0], [14.5, 8, 0], [16.6, 11, 0],
    [0.4, 9.6, 0], [1.6, 8.4, 0], [2.4, 12.5, 0],
    [3.2, 14.6, 0], [4.4, 17, 0], [7, 19.6, 0], [10, 19.6, 0],
    [15.6, 14.5, 0], [14.4, 17, 0], [16.6, 13, 0],
  ];
  function spriteURL(rows) {
    const c = document.createElement('canvas');
    c.width = rows[0].length; c.height = rows.length;
    const g = c.getContext('2d');
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === '.') return;
      g.fillStyle = ch === 'B' ? COLORS.handLine : COLORS.handFill;
      g.fillRect(x, y, 1, 1);
    }));
    return c.toDataURL();
  }
  const SPRITE_POINT = spriteURL(HAND);
  const SPRITE_GRAB = spriteURL(GRAB);
  cursorImg.src = SPRITE_POINT;

  /* ───────────────────────── geometry (stadium perimeter) ───────────────────────── */
  const base = { cx: 0, cy: 0, w: 340, h: 90 };
  const G = { cx: 0, cy: 0, r: 45, Ls: 250, c1x: 0, c2x: 0, P: 1, h: 90 };
  let bsx = 1, bsy = 1;
  // m: 0 = pill, 1 = ball (spring, so it overshoots and jiggles); scale: 0 = burst/gone, 1 = whole
  const MORPH = { phase: 'idle', t0: 0, t0r: 0, m: 0, mV: 0, mTarget: 0, scale: 1, ballR: 70, mass: 0, total: 1, merged: 0, reshapeAt: 0 };

  function measure() {
    const r = wrap.getBoundingClientRect();
    base.cx = r.left + r.width / 2; base.cy = r.top + r.height / 2;
    base.w = r.width; base.h = r.height;
  }
  function updateGeom() {
    const w = base.w * bsx, h = base.h * bsy;
    const ls = Math.max(0, w - h);
    // the ball keeps most of the pill's volume
    MORPH.ballR = Math.sqrt((ls * h + Math.PI * (h / 2) ** 2) / Math.PI) * 0.74;
    const m = MORPH.m;
    G.cx = base.cx; G.cy = base.cy;
    G.r = Math.max(0.5, (h / 2 + (MORPH.ballR - h / 2) * m) * MORPH.scale);
    G.h = G.r * 2;
    G.Ls = ls * Math.max(0, 1 - m) * MORPH.scale;
    G.c1x = G.cx - G.Ls / 2; G.c2x = G.cx + G.Ls / 2;
    G.P = 2 * G.Ls + TAU * G.r;
  }
  const tmp = { x: 0, y: 0, nx: 0, ny: 0 };
  function pointAt(s, out) {
    const { Ls, r, c1x, c2x, cy } = G;
    s = mod(s, G.P);
    const arc = Math.PI * r;
    if (s < Ls) { out.x = c1x + s; out.y = cy - r; out.nx = 0; out.ny = -1; }
    else if (s < Ls + arc) { const a = -Math.PI / 2 + (s - Ls) / r; out.nx = Math.cos(a); out.ny = Math.sin(a); out.x = c2x + out.nx * r; out.y = cy + out.ny * r; }
    else if (s < 2 * Ls + arc) { out.x = c2x - (s - Ls - arc); out.y = cy + r; out.nx = 0; out.ny = 1; }
    else { const a = Math.PI / 2 + (s - 2 * Ls - arc) / r; out.nx = Math.cos(a); out.ny = Math.sin(a); out.x = c1x + out.nx * r; out.y = cy + out.ny * r; }
    return out;
  }
  const prox = { s: 0, d: 1e9 };
  function closest(px, py, out = prox) {
    const { Ls, r, c1x, c2x, cy } = G;
    const qx = clamp(px, c1x, c2x);
    const dx = px - qx, dy = py - cy;
    out.d = Math.hypot(dx, dy) - r;
    const arc = Math.PI * r;
    if (px > c1x && px < c2x) out.s = dy < 0 ? px - c1x : Ls + arc + (c2x - px);
    else if (px >= c2x) out.s = Ls + (Math.atan2(dy, dx) + Math.PI / 2) * r;
    else { let a = Math.atan2(dy, dx); if (a < 0) a += TAU; out.s = 2 * Ls + arc + (a - Math.PI / 2) * r; }
    out.s = mod(out.s, G.P);
    return out;
  }

  /* ───────────────────────── liquid surface ─────────────────────────
     The edge is a ring of M samples, each displaced along its normal. Displacement
     chases a target shape (a swell toward the cursor, a lump under every strand root)
     through a heavily damped spring plus sideways diffusion, so bulges ooze rather than snap. */
  const disp = new Float32Array(M), dvel = new Float32Array(M), dtgt = new Float32Array(M);
  function addBump(arr, s, A, sigma) {
    const ds = G.P / M;
    const c = mod(s, G.P) / ds;
    const r = Math.ceil(3 * sigma / ds);
    const k0 = Math.round(c);
    const inv = 1 / (2 * sigma * sigma);
    for (let j = -r; j <= r; j++) {
      const k = k0 + j;
      const off = (k - c) * ds;
      arr[mod(k, M)] += A * Math.exp(-off * off * inv);
    }
  }
  function dispAt(s) {
    const f = mod(s, G.P) / G.P * M;
    const k = Math.floor(f), t = f - k;
    return disp[k % M] * (1 - t) + disp[(k + 1) % M] * t;
  }
  function surfAt(s, inset, out) {
    pointAt(s, out);
    const d = dispAt(s) - inset;
    out.x += out.nx * d; out.y += out.ny * d;
    return out;
  }
  function stepSurface() {
    const K = CFG.surfSpring, V = CFG.surfVisc, C = CFG.surfSpread;
    for (let k = 0; k < M; k++) {
      const lap = disp[(k + M - 1) % M] + disp[(k + 1) % M] - 2 * disp[k];
      dvel[k] = (dvel[k] + (dtgt[k] - disp[k]) * K + lap * C) * V;
    }
    for (let k = 0; k < M; k++) disp[k] += dvel[k];
  }

  /* ───────────────────────── canvas ───────────────────────── */
  let dpr = 1, vw = 0, vh = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    vw = innerWidth; vh = innerHeight;
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    measure();
  }
  addEventListener('resize', resize);
  addEventListener('scroll', measure, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(measure).observe(wrap);
  document.fonts?.ready.then(measure);

  /* ───────────────────────── state ───────────────────────── */
  const pointer = { x: -1e4, y: -1e4, active: false, type: 'mouse' };
  const strands = [], spikes = [];
  let bundleTarget = 0, cooldownUntil = 0, gripUntil = 0, nextTwitch = 0;
  let arcNow = CFG.rootArc;
  let grabbing = false, glow = 0, reflX = 0;
  let sc = 1, scV = 0;

  /* ───────────────────────── input ───────────────────────── */
  function placeCursor() {
    cursorEl.style.transform = `translate3d(${pointer.x - HOT.x * S}px, ${pointer.y - HOT.y * S}px, 0)`;
  }
  function onMove(e) {
    pointer.type = e.pointerType || 'mouse';
    if (pointer.type === 'touch' && !pointer.active) return;
    pointer.x = e.clientX; pointer.y = e.clientY;
    if (pointer.type !== 'touch') { pointer.active = true; cursorEl.classList.add('on'); placeCursor(); }
  }
  addEventListener('pointermove', onMove, { passive: true });
  addEventListener('pointerdown', e => {
    pointer.type = e.pointerType || 'mouse';
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.active = true;
    if (pointer.type === 'touch') cursorEl.classList.remove('on');
    else { cursorEl.classList.add('on', 'press'); placeCursor(); }
  });
  const release = e => {
    cursorEl.classList.remove('press');
    if ((e.pointerType || pointer.type) === 'touch') pointer.active = false;
  };
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);
  document.addEventListener('pointerleave', () => { if (pointer.type !== 'touch') { pointer.active = false; cursorEl.classList.remove('on'); } });
  document.documentElement.addEventListener('mouseleave', () => { pointer.active = false; cursorEl.classList.remove('on'); });
  addEventListener('blur', () => { pointer.active = false; cursorEl.classList.remove('on'); });

  function squeeze(now) {
    if (MORPH.phase !== 'idle') return;
    scV -= reduced ? 0.8 : 2.0;
    if (!reduced) startBall(now);
  }
  btn.addEventListener('pointerdown', () => squeeze(performance.now()));
  btn.addEventListener('click', e => { if (e.detail === 0) squeeze(performance.now()); });

  /* ───────────────────────── strands ───────────────────────── */
  function liveCount() {
    let c = 0;
    for (const st of strands) if (st.state !== 'retract') c++;
    return c;
  }
  function pickAnchor() {
    if (pointer.type === 'touch') {
      const a = rand(0, TAU), r = rand(3, 16);
      return { dx: Math.cos(a) * r, dy: Math.sin(a) * r, finger: false };
    }
    const a = ANCHORS[(Math.random() * ANCHORS.length) | 0];
    return { dx: (a[0] - HOT.x) * S + rand(-1, 1), dy: (a[1] - HOT.y) * S + rand(-1, 1), finger: !!a[2] };
  }
  function spawn(k, now) {
    const n = clamp(CFG.ropePoints | 0, 4, 24);
    const spread = CFG.stagger * k;
    const wmin = Math.min(CFG.widthMin, CFG.widthMax), wmax = Math.max(CFG.widthMin, CFG.widthMax);
    for (let j = 0; j < k; j++) {
      const st = {
        n,
        x: new Float32Array(n), y: new Float32Array(n), px: new Float32Array(n), py: new Float32Array(n),
        offN: (j + 0.5) / k - 0.5 + rand(-0.6, 0.6) / k,
        s: 0,
        anchor: pickAnchor(),
        width: wmin + (wmax - wmin) * Math.random() ** 1.3,
        alpha: rand(0.85, 1),
        breakDist: CFG.attachRadius * rand(Math.min(CFG.breakMin, CFG.breakMax), Math.max(CFG.breakMin, CFG.breakMax)),
        state: 'emerge', t0: now, delay: rand(0, spread) + rand(0, 14),
        dur: rand(CFG.emergeMin, Math.max(CFG.emergeMin, CFG.emergeMax)),
        rest: 0, rest0: 0, stretch: 0,
        phase: rand(0, TAU), freq: rand(1.4, 3.2), bias: rand(-1, 1),
        hidden: true, dead: false,
      };
      st.s = mod(prox.s + st.offN * arcNow, G.P);
      surfAt(st.s, 3, tmp);
      st.x.fill(tmp.x); st.px.fill(tmp.x); st.y.fill(tmp.y); st.py.fill(tmp.y);
      strands.push(st);
    }
  }
  function snap(st, now) {
    st.state = 'retract';
    st.t0 = now;
    st.rest0 = st.rest;
    const n = st.n, X = st.x, Y = st.y;
    // whip: kick the freed tip back toward its root, with a sideways flick
    const kx = (X[0] - X[n - 1]) * 0.035, ky = (Y[0] - Y[n - 1]) * 0.035;
    const f = rand(-0.5, 0.5);
    st.px[n - 1] = X[n - 1] - kx + ky * f;
    st.py[n - 1] = Y[n - 1] - ky - kx * f;
    if (liveCount() === 0) cooldownUntil = now + CFG.cooldownMs;
  }
  function settle(st, now) {
    st.dead = true;
    // the bead lands: the surface takes a slow bounce where it re-entered
    addBump(dvel, st.s, 0.35 + st.width * 0.12, 9);
    if (spikes.length < 140) {
      const k = randInt(Math.min(CFG.spikesMin, CFG.spikesMax), Math.max(CFG.spikesMin, CFG.spikesMax));
      for (let i = 0; i < k; i++) {
        spikes.push({ s: st.s + rand(-10, 10), len: rand(5, 15) * (0.7 + st.width * 0.2), w: rand(1.6, 3), t0: now + rand(0, 60), life: rand(480, 900), tilt: rand(-0.35, 0.35), curl: rand(-1, 1), phase: rand(0, TAU), mode: 'settle' });
      }
    }
  }
  const tmp2 = { x: 0, y: 0 };
  function tipTarget(st) {
    const a = st.anchor;
    tmp2.x = pointer.x + a.dx;
    tmp2.y = pointer.y + a.dy + (a.finger && grabbing ? 3.4 * S : 0);
    return tmp2;
  }

  /* ───────────────────────── burst & reform ─────────────────────────
     click → the pill pulls into a ball, shivers, bursts into droplets that spill across
     the screen under gravity, then every droplet is sucked home and the pill re-forms. */
  const drops = [];
  const tmpP = { s: 0, d: 0 };
  function startBall(now) {
    MORPH.phase = 'ball'; MORPH.t0 = now; MORPH.mTarget = 1; MORPH.mV += 1.2;
    for (const st of strands) if (st.state !== 'retract') snap(st, now);
    cooldownUntil = Infinity;
  }
  function burst(now) {
    MORPH.phase = 'spill'; MORPH.t0 = now; MORPH.scale = 0;
    const R = G.r, cx = G.cx, cy = G.cy;
    strands.length = 0; spikes.length = 0; disp.fill(0); dvel.fill(0);
    drops.length = 0; MORPH.total = 0;
    const n = CFG.burstDrops | 0;
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), big = Math.random() < 0.08;
      const r = big ? rand(8, 14) : 1.4 + 8 * Math.random() ** 2.4;
      const sp = CFG.burstSpeed * rand(0.2, 1.1) * (1.15 - r / 22);
      const off = R * Math.sqrt(Math.random()) * 0.9;
      const x = cx + Math.cos(a) * off, y = cy + Math.sin(a) * off;
      drops.push({ x, y, lx: x, ly: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(150, 450), r, floor: false, wall: 0, merged: false });
      MORPH.total += r * r;
    }
  }
  function startReform(now) {
    MORPH.phase = 'reform'; MORPH.t0r = now; MORPH.mass = 0; MORPH.merged = 0;
    const R = MORPH.ballR * 0.45;
    for (const d of drops) {
      const a = rand(0, TAU), q = R * Math.sqrt(Math.random());
      d.sx = d.x; d.sy = d.y;
      d.tx = base.cx + Math.cos(a) * q; d.ty = base.cy + Math.sin(a) * q;
      const dist = Math.hypot(d.tx - d.sx, d.ty - d.sy);
      d.delay = rand(0, 300);
      d.dur = 300 + dist * 0.35 + rand(0, 100);
      d.arc = rand(-0.22, 0.22) * dist;
    }
  }
  function updateMorph(now, dt) {
    if (MORPH.phase === 'idle') return;
    MORPH.mV += ((MORPH.mTarget - MORPH.m) * 170 - MORPH.mV * 11) * dt;
    MORPH.m += MORPH.mV * dt;
    const t = now - MORPH.t0;
    if (MORPH.phase === 'ball' && t >= CFG.ballMs) burst(now);
    else if (MORPH.phase === 'spill' && now - MORPH.t0 >= CFG.holdMs - CFG.ballMs) startReform(now);
    else if (MORPH.phase === 'reform') {
      if (MORPH.mTarget === 1) {
        if (now - MORPH.t0r > 1500) { for (const d of drops) d.merged = true; MORPH.mass = MORPH.total; MORPH.merged = drops.length; }
        const target = Math.sqrt(MORPH.mass / MORPH.total);
        MORPH.scale += (target - MORPH.scale) * Math.min(1, dt * 14);
        if (MORPH.merged >= drops.length) { MORPH.scale = 1; MORPH.mTarget = 0; MORPH.mV -= 0.6; MORPH.reshapeAt = now; drops.length = 0; }
      } else if (now - MORPH.reshapeAt > 800) {
        MORPH.phase = 'idle'; MORPH.m = 0; MORPH.mV = 0; MORPH.scale = 1;
        cooldownUntil = now + 400;
      }
    }
    wrap.style.setProperty('--shadow', (MORPH.scale * (1 - 0.35 * clamp(MORPH.m, 0, 1))).toFixed(3));
  }
  function stepDrops(now) {
    if (!drops.length) return;
    const g = CFG.gravity;
    if (MORPH.phase === 'spill') {
      for (const d of drops) {
        d.lx = d.x; d.ly = d.y;
        if (d.floor) { d.vx *= 0.9; d.x = clamp(d.x + d.vx * H, d.r, vw - d.r); continue; }
        if (d.wall) {
          // viscous: it clings to the wall and creeps down
          d.vy = Math.min(d.vy + g * 0.04 * H, 45); d.y += d.vy * H;
          if (d.y > vh - d.r) { d.y = vh - d.r; d.floor = true; d.wall = 0; d.vx = 0; }
          continue;
        }
        if (d.stuck) {
          // splatted on the glass: creeps down slowly, bigger drops faster
          d.y += (6 + d.r * 2.2) * H;
          if (d.y > vh - d.r) { d.y = vh - d.r; d.floor = true; d.vx = 0; }
          continue;
        }
        d.vx *= CFG.drag; d.vy = d.vy * CFG.drag + g * H;
        d.x += d.vx * H; d.y += d.vy * H;
        if (Math.hypot(d.vx, d.vy) < 70) { d.stuck = true; d.vx = d.vy = 0; }
        if (d.y > vh - d.r) { d.y = vh - d.r; if (d.vy > 260) { d.vy *= -0.22; d.vx *= 0.6; } else { d.vy = 0; d.floor = true; } }
        if (d.y < d.r) { d.y = d.r; d.vy *= -0.2; }
        if (d.x < d.r) { d.x = d.r; d.wall = -1; d.vx = 0; d.vy *= 0.15; }
        else if (d.x > vw - d.r) { d.x = vw - d.r; d.wall = 1; d.vx = 0; d.vy *= 0.15; }
      }
    } else if (MORPH.phase === 'reform') {
      for (const d of drops) {
        if (d.merged) continue;
        const t = (now - MORPH.t0r - d.delay) / d.dur;
        d.lx = d.x; d.ly = d.y;
        if (t <= 0) continue;
        if (t >= 1) {
          d.merged = true; MORPH.mass += d.r * d.r; MORPH.merged++;
          addBump(dvel, closest(d.sx, d.sy, tmpP).s, 0.3 + d.r * 0.06, 10);
          continue;
        }
        const e = t * t;
        const ex = d.tx - d.sx, ey = d.ty - d.sy, L = Math.hypot(ex, ey) || 1;
        const bow = Math.sin(Math.PI * t) * d.arc;
        d.x = d.sx + ex * e - ey / L * bow; d.y = d.sy + ey * e + ex / L * bow;
        d.floor = false; d.wall = 0; d.stuck = false;
      }
    }
  }

  function step(now) {
    const tsec = now / 1000;
    const h2 = H * H;
    const slideK = 1 - Math.exp(-H * 8);
    stepSurface();
    stepDrops(now);
    for (const st of strands) {
      if (st.dead) continue;
      const n = st.n, X = st.x, Y = st.y, PX = st.px, PY = st.py;

      if (st.state !== 'retract') {
        const tgt = mod(prox.s + st.offN * arcNow, G.P);
        const dl = mod(tgt - st.s + G.P / 2, G.P) - G.P / 2;
        st.s = mod(st.s + dl * slideK, G.P);
      }
      surfAt(st.s, 3, tmp);
      const rx = tmp.x, ry = tmp.y;
      X[0] = PX[0] = rx; Y[0] = PY[0] = ry;

      let tipPinned = true, tx = 0, ty = 0;
      if (st.state === 'emerge') {
        const t = (now - st.t0 - st.delay) / st.dur;
        if (t < 0) { X.fill(rx); PX.fill(rx); Y.fill(ry); PY.fill(ry); st.hidden = true; continue; }
        st.hidden = false;
        const T = tipTarget(st);
        const e = easeOutBack(Math.min(t, 1));
        tx = rx + (T.x - rx) * e; ty = ry + (T.y - ry) * e;
        st.rest = Math.hypot(tx - rx, ty - ry) * (1 + CFG.slack);
        if (t >= 1) st.state = 'attached';
        if (!pointer.active && Math.random() < 0.1) { snap(st, now); tipPinned = false; }
      } else if (st.state === 'attached') {
        const T = tipTarget(st);
        tx = T.x; ty = T.y;
        const d = Math.hypot(tx - rx, ty - ry);
        st.stretch = d / st.breakDist;
        if (st.stretch > 1 || (!pointer.active && Math.random() < 0.1)) { snap(st, now); tipPinned = false; }
        else {
          const k = 1 - st.stretch;
          st.rest = now < gripUntil ? d * 0.93 : d * (1 + CFG.slack * k * k);
        }
      }
      let retractT = 0;
      if (st.state === 'retract') {
        tipPinned = false;
        retractT = (now - st.t0) / CFG.retractMs;
        if (retractT >= 1) { settle(st, now); continue; }
        st.rest = st.rest0 * (1 - retractT) ** 1.5;
        st.stretch *= 0.92;
      }

      // integrate
      const ex = (tipPinned ? tx : X[n - 1]) - rx, ey = (tipPinned ? ty : Y[n - 1]) - ry;
      const el = Math.hypot(ex, ey) || 1;
      const perpX = -ey / el, perpY = ex / el;
      const damp = CFG.damping;
      const kR = retractT ? 110 * (0.4 + retractT) : 0;
      const last = tipPinned ? n - 1 : n;
      for (let i = 1; i < last; i++) {
        const u = i / (n - 1);
        const env = Math.sin(Math.PI * Math.min(u, 0.999));
        const lat = (Math.sin(tsec * st.freq + st.phase + i * 0.7) * CFG.wobble + st.bias * CFG.bend) * env;
        let ax = perpX * lat, ay = perpY * lat;
        if (kR) { ax += (rx - X[i]) * kR; ay += (ry - Y[i]) * kR; }
        const vx = (X[i] - PX[i]) * damp, vy = (Y[i] - PY[i]) * damp;
        PX[i] = X[i]; PY[i] = Y[i];
        X[i] += vx + ax * h2; Y[i] += vy + ay * h2;
      }
      if (tipPinned) { PX[n - 1] = X[n - 1]; PY[n - 1] = Y[n - 1]; X[n - 1] = tx; Y[n - 1] = ty; }

      // constraints
      const L = st.rest / (n - 1);
      const stiff = now < gripUntil ? 1 : CFG.stiffness;
      const iters = CFG.iterations | 0;
      for (let it = 0; it < iters; it++) {
        for (let i = 0; i < n - 1; i++) {
          const wa = i === 0 ? 0 : 1, wb = (i + 1 === n - 1 && tipPinned) ? 0 : 1;
          const ws = wa + wb;
          if (!ws) continue;
          const dx = X[i + 1] - X[i], dy = Y[i + 1] - Y[i];
          const d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
          const diff = (d - L) / d * stiff / ws;
          X[i] += dx * diff * wa; Y[i] += dy * diff * wa;
          X[i + 1] -= dx * diff * wb; Y[i + 1] -= dy * diff * wb;
        }
      }
    }
    if (strands.some(s => s.dead)) {
      for (let i = strands.length - 1; i >= 0; i--) if (strands[i].dead) strands.splice(i, 1);
    }
  }

  // what shape the surface is trying to reach this frame
  function buildSurfaceTarget(now, hovering) {
    const t = now / 1000;
    for (let k = 0; k < M; k++) {
      const a = k / M * TAU;
      dtgt[k] = reduced ? 0 : 0.7 * Math.sin(a * 3 + t * 0.8) + 0.5 * Math.sin(a * 7 - t * 1.1);
    }
    if (reduced) return;
    if (MORPH.phase === 'ball') {
      // the ball shivers just before it bursts
      const u = (now - MORPH.t0) / CFG.ballMs;
      if (u > 0.5) { const amp = (u - 0.5) / 0.5 * 4.5; for (let k = 0; k < M; k++) dtgt[k] += amp * Math.sin(k * 1.7 + now * 0.09); }
    }
    const reach = CFG.attachRadius * 1.25;
    if (MORPH.phase === 'idle' && pointer.active && prox.d < reach && !hovering) {
      const live = liveCount();
      const A = CFG.mound * clamp(1 - prox.d / reach, 0, 1) ** 1.4 * (live ? 1 : 0.55);
      addBump(dtgt, prox.s, A, Math.max(16, arcNow * 0.42));
    }
    for (const st of strands) {
      if (st.hidden) continue;
      const pull = st.state === 'retract' ? 1 - (now - st.t0) / CFG.retractMs : 1;
      addBump(dtgt, st.s, (1.4 + 5 * clamp(st.stretch, 0, 1)) * pull * (0.5 + st.width * 0.25), 8);
    }
  }

  /* ───────────────────────── render ───────────────────────── */
  const BX = new Float32Array(M), BY = new Float32Array(M);
  const LX = new Float32Array(64), LY = new Float32Array(64), RX = new Float32Array(64), RY = new Float32Array(64);
  const GX = new Float32Array(64), GY = new Float32Array(64);

  function traceBody(sx = 1, sy = 1, oy = 0) {
    const cx = G.cx, cy = G.cy;
    const px = i => cx + (BX[i] - cx) * sx, py = i => cy + (BY[i] - cy) * sy + oy;
    ctx.beginPath();
    ctx.moveTo((px(M - 1) + px(0)) / 2, (py(M - 1) + py(0)) / 2);
    for (let k = 0; k < M; k++) {
      const j = (k + 1) % M;
      ctx.quadraticCurveTo(px(k), py(k), (px(k) + px(j)) / 2, (py(k) + py(j)) / 2);
    }
    ctx.closePath();
  }

  function drawDrops() {
    if (!drops.length) return;
    ctx.fillStyle = COLORS.strand;
    for (const d of drops) {
      if (d.merged) continue;
      let rx = d.r, ry = d.r, ang = 0, cx = d.x, cy = d.y;
      if (d.floor) { rx = d.r * 1.5; ry = d.r * 0.6; cy = vh - ry; }
      else if (d.wall) { rx = d.r * 0.6; ry = d.r * 1.4; cx = d.wall < 0 ? rx : vw - rx; }
      else if (d.stuck) { rx = d.r * 1.05; ry = d.r * 1.18; cy = d.y + d.r * 0.12; }
      else {
        const vx = d.x - d.lx, vy = d.y - d.ly;
        const k = clamp(1 + Math.hypot(vx, vy) / H / 1200, 1, 2.6);
        rx = d.r * k; ry = d.r / Math.sqrt(k); ang = Math.atan2(vy, vx);
      }
      d.dx = cx; d.dy = cy; d.rx = rx; d.ry = ry;
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, ang, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (const d of drops) {
      if (d.merged || d.r < 2.6) continue;
      ctx.beginPath(); ctx.ellipse(d.dx - d.rx * 0.28, d.dy - d.ry * 0.42, Math.min(d.rx, d.ry * 1.6) * 0.34, d.ry * 0.16, 0, 0, TAU); ctx.fill();
    }
  }

  function drawBody(now) {
    if (MORPH.scale < 0.02) return;
    for (let k = 0; k < M; k++) {
      pointAt(k / M * G.P, tmp);
      BX[k] = tmp.x + tmp.nx * disp[k];
      BY[k] = tmp.y + tmp.ny * disp[k];
    }
    const top = G.cy - G.r, h = G.h;
    // lacquer body
    const body = ctx.createLinearGradient(0, top - 10, 0, top + h + 10);
    body.addColorStop(0, COLORS.bodyTop);
    body.addColorStop(0.5, COLORS.bodyMid);
    body.addColorStop(0.78, '#020203');
    body.addColorStop(1, COLORS.bodyLow);
    ctx.fillStyle = body;
    traceBody();
    ctx.fill();

    ctx.save();
    traceBody();
    ctx.clip();
    // bottom caustic, light bounced up through the liquid
    const cg = ctx.createRadialGradient(G.cx, top + h * 1.05, 0, G.cx, top + h * 1.05, G.Ls * 0.5 + G.r);
    cg.addColorStop(0, COLORS.caustic);
    cg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = cg;
    ctx.fillRect(G.cx - G.Ls / 2 - G.r, top + h * 0.5, G.Ls + G.r * 2, h);
    // top specular band: a squashed copy of the live surface, so it bends over every bulge
    const sg = ctx.createLinearGradient(0, top, 0, G.cy + 2);
    sg.addColorStop(0, COLORS.specular);
    sg.addColorStop(0.45, 'rgba(255,255,255,0.12)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    traceBody(0.9, 0.46, -h * 0.24);
    ctx.fill();
    // a hot reflection that slides with the cursor, like a window caught in wet paint
    const target = pointer.active ? clamp((pointer.x - G.cx) * 0.12, -G.Ls * 0.4, G.Ls * 0.4) : 0;
    reflX += (target - reflX) * 0.06;
    const rgx = G.cx + reflX, rgy = top + h * 0.17;
    const rg = ctx.createRadialGradient(rgx, rgy, 0, rgx, rgy, 34);
    rg.addColorStop(0, 'rgba(255,255,255,0.55)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.save();
    ctx.translate(rgx, rgy); ctx.scale(1, 0.16); ctx.translate(-rgx, -rgy);
    ctx.beginPath(); ctx.arc(rgx, rgy, 34, 0, TAU); ctx.fill();
    ctx.restore();
    // rim light hugging the edge, brightest where the surface faces up
    const rimG = ctx.createLinearGradient(0, top - 16, 0, top + h + 16);
    rimG.addColorStop(0, COLORS.rim);
    rimG.addColorStop(0.32, 'rgba(255,255,255,0.05)');
    rimG.addColorStop(0.7, 'rgba(255,255,255,0)');
    rimG.addColorStop(1, 'rgba(255,255,255,0.14)');
    ctx.strokeStyle = rimG;
    ctx.lineWidth = 2.4;
    traceBody();
    ctx.stroke();
    ctx.restore();

    // label rides the squeeze, and melts away while it's a ball
    const la = clamp(1 - Math.abs(MORPH.m) * 1.8, 0, 1) * MORPH.scale;
    if (la < 0.01) return;
    ctx.save();
    ctx.globalAlpha = la;
    ctx.translate(G.cx, G.cy + 1);
    ctx.scale(bsx, bsy);
    ctx.fillStyle = COLORS.label;
    ctx.font = '700 27px Outfit, "Helvetica Neue", Helvetica, Arial, sans-serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '-0.3px';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText("let's collaborate", 0, 0);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    ctx.restore();
  }

  function drawStrand(st) {
    const n = st.n, X = st.x, Y = st.y;
    const s2 = clamp(st.stretch, 0, 1) ** 2;
    const thin = 1 / (1 + s2 * 0.8);
    const retracting = st.state === 'retract';
    const w0 = st.width * 2.1 * thin, w1 = Math.max(0.5, st.width * 0.38) * thin;
    for (let i = 0; i < n; i++) {
      const a = Math.max(0, i - 1), b = Math.min(n - 1, i + 1);
      const tx = X[b] - X[a], ty = Y[b] - Y[a];
      const tl = Math.hypot(tx, ty) || 1;
      let nx = -ty / tl, ny = tx / tl;
      const u = i / (n - 1);
      // body taper, a wide fillet where it leaves the pool, and a neck that pinches as it stretches
      let w = w1 + (w0 - w1) * (1 - u) ** 1.6;
      w += st.width * 2.6 * Math.max(0, 1 - u * 5) ** 2;
      w *= 1 - Math.min(0.7, CFG.necking * 0.5 * s2 * Math.sin(Math.PI * u));
      LX[i] = X[i] + nx * w / 2; LY[i] = Y[i] + ny * w / 2;
      RX[i] = X[i] - nx * w / 2; RY[i] = Y[i] - ny * w / 2;
      if (ny > 0) { nx = -nx; ny = -ny; }           // glint on the lit (upper) side
      GX[i] = X[i] + nx * w * 0.24; GY[i] = Y[i] + ny * w * 0.24;
    }
    ctx.globalAlpha = st.alpha;
    ctx.beginPath();
    ctx.moveTo(LX[0], LY[0]);
    for (let i = 1; i < n - 1; i++) ctx.quadraticCurveTo(LX[i], LY[i], (LX[i] + LX[i + 1]) / 2, (LY[i] + LY[i + 1]) / 2);
    ctx.lineTo(LX[n - 1], LY[n - 1]);
    ctx.lineTo(RX[n - 1], RY[n - 1]);
    for (let i = n - 2; i > 0; i--) ctx.quadraticCurveTo(RX[i], RY[i], (RX[i] + RX[i - 1]) / 2, (RY[i] + RY[i - 1]) / 2);
    ctx.lineTo(RX[0], RY[0]);
    ctx.closePath();
    ctx.fill();
    // meniscus where it leaves the pool, bead at the tip once it lets go
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(X[0], Y[0], st.width * 1.6 + 1.2, 0, TAU);
    ctx.fill();
    if (retracting) {
      ctx.beginPath();
      ctx.arc(X[n - 1], Y[n - 1], Math.max(1.2, st.width * 1.05), 0, TAU);
      ctx.fill();
    }
  }

  function drawGlint(st) {
    if (st.width < 1.4) return;
    const n = st.n;
    const m = Math.max(3, Math.round(n * 0.7));
    ctx.globalAlpha = st.alpha;
    ctx.beginPath();
    ctx.moveTo(GX[1], GY[1]);
    for (let i = 2; i < m; i++) ctx.quadraticCurveTo(GX[i - 1], GY[i - 1], (GX[i - 1] + GX[i]) / 2, (GY[i - 1] + GY[i]) / 2);
    ctx.stroke();
  }

  function drawSpike(sp, now) {
    const t = (now - sp.t0) / sp.life;
    if (t < 0) return true;
    if (t >= 1) return false;
    const L = sp.mode === 'settle'
      ? sp.len * (1 - t) ** 2.2 * (1 + 0.22 * Math.sin(t * 18 + sp.phase))
      : sp.len * Math.sin(Math.PI * t) * (1 + 0.12 * Math.sin(t * 22 + sp.phase));
    if (L < 0.4) return true;
    surfAt(sp.s, 0, tmp);
    const c = Math.cos(sp.tilt), s = Math.sin(sp.tilt);
    const dx = tmp.nx * c - tmp.ny * s, dy = tmp.nx * s + tmp.ny * c;
    const bx = tmp.x - tmp.nx * 3, by = tmp.y - tmp.ny * 3;
    const tipX = tmp.x + dx * L, tipY = tmp.y + dy * L;
    const w = sp.w * (sp.mode === 'settle' ? 1 - t * 0.4 : 0.8);
    const cxp = tmp.x + dx * L * 0.5 - dy * L * 0.16 * sp.curl, cyp = tmp.y + dy * L * 0.5 + dx * L * 0.16 * sp.curl;
    ctx.beginPath();
    ctx.moveTo(bx - dy * w * 1.8, by + dx * w * 1.8);
    ctx.quadraticCurveTo(cxp - dy * w * 0.5, cyp + dx * w * 0.5, tipX, tipY);
    ctx.quadraticCurveTo(cxp + dy * w * 0.5, cyp - dx * w * 0.5, bx + dy * w * 1.8, by - dx * w * 1.8);
    ctx.closePath();
    ctx.fill();
    return true;
  }

  function drawOverlay() {
    ctx.strokeStyle = COLORS.overlay;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 5]);
    ctx.beginPath();
    for (let s = 0; s <= G.P; s += 6) {
      pointAt(s, tmp);
      const x = tmp.x + tmp.nx * CFG.attachRadius, y = tmp.y + tmp.ny * CFG.attachRadius;
      s ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    if (pointer.active) {
      pointAt(prox.s, tmp);
      ctx.fillStyle = '#e0301e';
      ctx.beginPath(); ctx.arc(tmp.x, tmp.y, 3, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(224,48,30,0.5)';
      ctx.beginPath(); ctx.moveTo(tmp.x, tmp.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
    }
  }

  /* ───────────────────────── main loop ───────────────────────── */
  let last = performance.now(), acc = 0, fpsT = 0, fpsN = 0;
  const fpsEl = document.getElementById('fps');
  const overlayBox = document.getElementById('dbgOverlay');

  function frame(now) {
    const dtMs = Math.min(now - last, 50);
    last = now;
    const dt = dtMs / 1000;

    // pool spring: breathing on hover, squeeze on click
    updateMorph(now, dt);
    updateGeom();
    closest(pointer.x, pointer.y);
    const morphing = MORPH.phase !== 'idle';
    const hovering = !morphing && pointer.active && prox.d < 0;
    const target = hovering ? (reduced ? 1.02 : 1.028 + 0.01 * Math.sin(now / 1000 * 2.2)) : 1;
    scV += ((target - sc) * 300 - scV * 17) * dt;
    sc += scV * dt;
    const sq = Math.max(0, target - sc);
    bsx = sc + sq * 0.45; bsy = sc - sq * 0.6;

    buildSurfaceTarget(now, hovering);
    if (reduced) {
      const g = pointer.active ? clamp(1 - prox.d / CFG.attachRadius, 0, 1) : 0;
      glow += (g - glow) * Math.min(1, dt * 8);
      wrap.style.setProperty('--glow', glow.toFixed(3));
    } else {
      arcNow += ((hovering ? CFG.hoverArc : CFG.rootArc) - arcNow) * Math.min(1, dt * 5);
      const inRange = !morphing && pointer.active && prox.d < CFG.attachRadius;
      const live = liveCount();
      if (inRange && now >= cooldownUntil && live < Math.max(1, bundleTarget * 0.5)) {
        if (live === 0) bundleTarget = randInt(Math.min(CFG.strandsMin, CFG.strandsMax), Math.max(CFG.strandsMin, CFG.strandsMax));
        spawn(Math.max(1, bundleTarget - live), now);
        cooldownUntil = now + 260;
      }
      // idle: a couple of hairs twitch on the edge
      if (!morphing && !strands.length && (!pointer.active || prox.d > CFG.attachRadius * 1.25) && now >= nextTwitch) {
        if (nextTwitch) {
          const s0 = rand(0, G.P), k = randInt(1, 3);
          for (let i = 0; i < k; i++) spikes.push({ s: s0 + rand(-7, 7), len: rand(6, 14), w: rand(1.2, 2.2), t0: now + i * rand(40, 140), life: rand(700, 1200), tilt: rand(-0.3, 0.3), curl: rand(-1, 1), phase: rand(0, TAU), mode: 'twitch' });
          addBump(dvel, s0, 0.25, 10);
        }
        nextTwitch = now + rand(CFG.idleMin, Math.max(CFG.idleMin, CFG.idleMax));
      }
    }
    acc += dt;
    let steps = 0;
    while (acc >= H && steps < 6) {
      if (reduced) stepSurface(); else step(now - (acc - H) * 1000);
      acc -= H; steps++;
    }
    if (steps === 6) acc = 0;

    const g = strands.some(s => s.state !== 'retract' && !s.hidden);
    if (g !== grabbing) {
      grabbing = g;
      cursorImg.src = g ? SPRITE_GRAB : SPRITE_POINT;
      cursorEl.classList.toggle('grab', g);
    }

    // draw: pool, residue, strands, then their wet glints on top
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, vw, vh);
    drawBody(now);
    drawDrops();
    ctx.fillStyle = COLORS.strand;
    for (let i = spikes.length - 1; i >= 0; i--) if (!drawSpike(spikes[i], now)) spikes.splice(i, 1);
    ctx.strokeStyle = COLORS.glint;
    ctx.lineWidth = 0.7;
    ctx.lineCap = 'round';
    for (const st of strands) {
      if (st.hidden) continue;
      drawStrand(st);
      drawGlint(st);
    }
    ctx.globalAlpha = 1;
    if (!dbg.hidden && overlayBox.checked) drawOverlay();

    if (!dbg.hidden) {
      fpsN++; fpsT += dtMs;
      if (fpsT > 500) { fpsEl.textContent = `${Math.round(fpsN * 1000 / fpsT)} fps · ${strands.length} strands`; fpsT = 0; fpsN = 0; }
    }
    requestAnimationFrame(frame);
  }

  /* ───────────────────────── debug panel (press D) ───────────────────────── */
  const KNOBS = [
    ['attachRadius', 40, 420, 1], ['strandsMin', 1, 80, 1], ['strandsMax', 1, 80, 1], ['ropePoints', 4, 24, 1],
    ['stiffness', 0.1, 1, 0.01], ['iterations', 1, 12, 1], ['damping', 0.7, 1, 0.001], ['slack', 0, 0.6, 0.01],
    ['rootArc', 0, 400, 1], ['hoverArc', 0, 200, 1], ['breakMin', 1, 3, 0.01], ['breakMax', 1, 4, 0.01],
    ['widthMin', 0.2, 5, 0.05], ['widthMax', 0.4, 7, 0.05], ['necking', 0, 2, 0.01], ['wobble', 0, 4000, 10], ['bend', 0, 3000, 10],
    ['emergeMin', 40, 1000, 5], ['emergeMax', 40, 1000, 5], ['stagger', 0, 40, 1], ['retractMs', 80, 1400, 10],
    ['cooldownMs', 0, 2000, 10], ['spikesMin', 0, 16, 1], ['spikesMax', 0, 16, 1],
    ['mound', 0, 40, 0.5], ['surfSpring', 0.001, 0.05, 0.001], ['surfVisc', 0.6, 0.99, 0.005], ['surfSpread', 0, 0.24, 0.005],
    ['ballMs', 150, 1200, 10], ['holdMs', 800, 5000, 50], ['burstDrops', 20, 400, 1], ['burstSpeed', 200, 3000, 10], ['gravity', 0, 4000, 10], ['drag', 0.9, 1, 0.001],
  ];
  const knobsEl = document.getElementById('knobs');
  const fmt = (v, step) => step >= 1 ? String(Math.round(v)) : (+v).toFixed(step < 0.01 ? 3 : 2);
  const inputs = {};
  for (const [key, min, max, stepV] of KNOBS) {
    const id = 'k-' + key;
    const lab = document.createElement('label'); lab.htmlFor = id; lab.textContent = key;
    const inp = document.createElement('input');
    Object.assign(inp, { type: 'range', id, min, max, step: stepV, value: CFG[key] });
    const out = document.createElement('output'); out.htmlFor = id; out.textContent = fmt(CFG[key], stepV);
    inp.addEventListener('input', () => { CFG[key] = +inp.value; out.textContent = fmt(CFG[key], stepV); });
    knobsEl.append(lab, inp, out);
    inputs[key] = [inp, out, stepV];
  }
  document.getElementById('dbgReset').addEventListener('click', () => {
    Object.assign(CFG, DEFAULTS);
    for (const k in inputs) { const [inp, out, sv] = inputs[k]; inp.value = CFG[k]; out.textContent = fmt(CFG[k], sv); }
  });
  addEventListener('keydown', e => {
    if (e.target instanceof HTMLInputElement && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
    if ((e.key === 'd' || e.key === 'D') && !e.metaKey && !e.ctrlKey && !e.altKey) dbg.hidden = !dbg.hidden;
  });

  resize();
  updateGeom();
  requestAnimationFrame(frame);
})();
</script>
